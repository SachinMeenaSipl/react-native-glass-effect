# Codemagic: builds the Expo example app (examples/liquid-glass-expo) as an installable
# release APK and emails a download link. Runs outside GitHub Actions.
#
# Triggers: a push to main, or a tag like v0.3.0. Builds can also be started from the
# Codemagic dashboard. See examples/README.md for the one-time setup.
workflows:
  example-apk:
    name: Example APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      java: 17
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      # The library itself (npm ci runs `prepare`, which builds lib/).
      - name: Install the library
        script: npm ci

      - name: Install the example app
        script: cd examples/liquid-glass-expo && npm ci

      # Stamp the version so installed builds are easy to tell apart.
      - name: Set app version
        script: |
          cd examples/liquid-glass-expo
          LIB_VERSION=$(node -p "require('../../package.json').version")
          if [ -n "$CM_TAG" ]; then VERSION="${CM_TAG#v}"; else VERSION="${LIB_VERSION}-build.${BUILD_NUMBER}"; fi
          echo "Building version $VERSION"
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.version = '$VERSION';
            app.expo.android.versionCode = Number(process.env.BUILD_NUMBER);
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          "
          echo "$VERSION" > "$CM_BUILD_DIR/app-version.txt"

      # android/ isn't committed: generate it (Expo Continuous Native Generation).
      - name: Generate the Android project
        script: cd examples/liquid-glass-expo && npx expo prebuild --platform android --no-install

      # Release build: the JavaScript is bundled into the APK, so it runs without a dev server.
      # arm64-v8a covers practically every Android phone made since 2017 and keeps the APK small.
      - name: Build APK
        script: |
          cd examples/liquid-glass-expo/android
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          VERSION=$(cat "$CM_BUILD_DIR/app-version.txt")
          mkdir -p "$CM_BUILD_DIR/out"
          cp app/build/outputs/apk/release/app-release.apk "$CM_BUILD_DIR/out/liquid-glass-example-${VERSION}.apk"

    artifacts:
      - out/*.apk

    publishing:
      email:
        recipients:
          - sachin.meena.personal@gmail.com
        notify:
          success: true
          failure: true
