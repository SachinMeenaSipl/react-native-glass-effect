name: Docs

# Builds the documentation site (website/ + docs/ + the live demo from examples/web-vite)
# and publishes it to the gh-pages branch, which GitHub Pages serves.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'website/**', 'examples/shared/**', 'examples/web-vite/**', 'src/**', 'package.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      # The library itself (builds lib/ and lib/web, used by the live demo).
      - run: npm ci

      - run: npm ci
        working-directory: examples/web-vite
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website

      - name: Publish to gh-pages
        working-directory: website/.vitepress/dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy docs from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
